name: Build & Push Presto Docker Image

# Builds the Presto image used for connector test/deploy clusters (with the
# Hudi/Iceberg connectors) and publishes it to the onehouse Docker Hub org
# instead of a personal account.
#
# The image itself is generic (bundles the official presto-server + presto-cli
# release artifacts plus connector scaffolding); cluster-specific catalog
# configs (Glue metastore, S3, etc.) are mounted at deploy time via the
# presto-cfg ConfigMap in onehouseinc/infra-test-automation, not baked in here.
on:
  workflow_dispatch:
    inputs:
      presto_version:
        description: "Presto release version to package (e.g. 0.299)"
        required: true
        default: "0.299"
      image_tag:
        description: "Docker image tag to publish (defaults to presto-<presto_version>)"
        required: false
      infra_ref:
        description: "Branch/tag/SHA of onehouseinc/infra-test-automation to pull the deploy Dockerfile + configs from"
        required: false
        default: "main"

env:
  # No version suffix: the bundled hudi-presto-bundle version varies by which
  # connector reads it (legacy hive-hadoop2/iceberg vs. the dedicated hudi
  # connector) and drifts release to release — the image tag (presto-<version>)
  # already identifies the Presto release.
  DOCKERHUB_REPO: onehouse/presto-hudi

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Resolve version/tag
        id: vars
        env:
          PRESTO_VERSION: ${{ inputs.presto_version }}
          IMAGE_TAG_INPUT: ${{ inputs.image_tag }}
        run: |
          tag="${IMAGE_TAG_INPUT:-presto-${PRESTO_VERSION}}"
          echo "version=${PRESTO_VERSION}" >> "$GITHUB_OUTPUT"
          echo "tag=${tag}" >> "$GITHUB_OUTPUT"

      # The deploy Dockerfile + catalog scaffolding live in the private
      # infra-test-automation repo, not in this repo.
      - name: Checkout deployment config (infra-test-automation)
        uses: actions/checkout@v6
        with:
          repository: onehouseinc/infra-test-automation
          ref: ${{ inputs.infra_ref }}
          token: ${{ secrets.CI_PAT }}
          sparse-checkout: |
            infrastructure/presto_new_connector
          sparse-checkout-cone-mode: false
          persist-credentials: false
          path: infra-test-automation

      - name: Download Presto server + CLI release artifacts
        working-directory: infra-test-automation/infrastructure/presto_new_connector
        env:
          PRESTO_VERSION: ${{ steps.vars.outputs.version }}
        run: |
          # jars/ holds large binary build inputs and isn't committed to the repo.
          mkdir -p jars
          cd jars
          curl -sL --fail -o "presto-server-${PRESTO_VERSION}.tar.gz" \
            "https://repo1.maven.org/maven2/com/facebook/presto/presto-server/${PRESTO_VERSION}/presto-server-${PRESTO_VERSION}.tar.gz"
          curl -sL --fail -o "presto-cli-${PRESTO_VERSION}-executable.jar" \
            "https://github.com/prestodb/presto/releases/download/${PRESTO_VERSION}/presto-cli-${PRESTO_VERSION}-executable.jar"

      - name: Point Dockerfile at the resolved version
        working-directory: infra-test-automation/infrastructure/presto_new_connector
        env:
          PRESTO_VERSION: ${{ steps.vars.outputs.version }}
        run: |
          sed -i \
            -e "s/presto-server-[0-9.]\+\(-SNAPSHOT\)\?\.tar\.gz/presto-server-${PRESTO_VERSION}.tar.gz/g" \
            -e "s/presto-server-[0-9.]\+\(-SNAPSHOT\)\?\(\s\|$\)/presto-server-${PRESTO_VERSION}\2/g" \
            -e "s/presto-cli-[0-9.]\+\(-SNAPSHOT\)\?-executable\.jar/presto-cli-${PRESTO_VERSION}-executable.jar/g" \
            Dockerfile
          cat Dockerfile

      - name: Login to Docker Hub (onehouse)
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_KEY }}

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: infra-test-automation/infrastructure/presto_new_connector
          platforms: linux/amd64
          push: true
          tags: ${{ env.DOCKERHUB_REPO }}:${{ steps.vars.outputs.tag }}
